esphome:
  name: alarm
  platform: ESP8266
  board: nodemcuv2

external_components:
  - source:
      type: git
      url: https://github.com/Margriko/Paradox-ESPHome
      ref: v2

wifi:
  ssid: !secret wifi_name
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "alarm"
    password: !secret wifi_password

# Enable logging
logger:
  baud_rate: 0

# Enable Home Assistant API
api:

ota:

status_led:
  pin:
    number: D4
    inverted: yes

paradox_combus:
  id: combus
  clk_pin: D1
  # Legacy/shared data pin:
  # dta_pin: D2
  # 3-channel optocoupler wiring:
  read_pin: D2
  write_pin: D3
  sample_delay_us: 150
  invert_data: false

binary_sensor:
  - platform: paradox_combus
    paradox_combus_id: combus
    zone: 1
    name: "Entrance motion"
    device_class: motion
  - platform: paradox_combus
    paradox_combus_id: combus
    zone: 2
    name: "Living room motion"
    device_class: motion
  - platform: paradox_combus
    paradox_combus_id: combus
    zone: 3
    name: "Terrace door"
    device_class: door
  - platform: paradox_combus
    paradox_combus_id: combus
    zone: 4
    name: "Service room motion"
    device_class: motion
  - platform: paradox_combus
    paradox_combus_id: combus
    zone: 5
    name: "Service room door"
    device_class: door
  - platform: paradox_combus
    paradox_combus_id: combus
    zone: 6
    name: "Child room motion"
    device_class: motion
  - platform: paradox_combus
    paradox_combus_id: combus
    zone: 7
    name: "Bedroom motion"
    device_class: motion
  - platform: paradox_combus
    paradox_combus_id: combus
    zone: 8
    name: "Smoke detector"
    device_class: smoke
  - platform: paradox_combus
    paradox_combus_id: combus
    zone: 9
    name: "Entrance door"
    device_class: door

alarm_control_panel:
  - platform: paradox_combus
    paradox_combus_id: combus
    name: "Alarm"
    # IMPORTANT: these are example bytes and will likely need adjustment for your panel/code.
    disarm_sequence: "1234"
    arm_home_sequence: "S"
    arm_away_sequence: "A"
    arm_night_sequence: "N"
